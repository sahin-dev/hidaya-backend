services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: sahin
      MONGO_INITDB_ROOT_PASSWORD: sahin

  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: mongo-express
    restart: always
    ports:
      - 8081:8081
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: sahin
      ME_CONFIG_MONGODB_ADMINPASSWORD: sahin
      ME_CONFIG_MONGODB_SERVER: mongo
      
    

  backend:
    build: .
    container_name: backend
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      DB_URL: mongodb://sahin:sahin@mongo:27017/hidaya?authSource=admin
    ports:
      - 5000:5000
    command: npm run dev

volumes:
  mongo-data:
  logs:

